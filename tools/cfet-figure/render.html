<!doctype html>
<html><head><meta charset="utf-8">
<!-- Panel a of assets/cfet/cfet-inv-x1.webp: the MATRIX-A5 inv_x1 cell in 3D at true scale.
     Geometry comes from boxes.json (export_boxes.py). Serve the portfolio root over http and run make.js. -->
<style>html,body{margin:0;background:#fff}canvas{display:block}#ov{position:absolute;left:0;top:0}</style>
<script type="importmap">{"imports":{"three":"../../assets/vendor/three/three.module.min.js"}}</script>
</head><body>
<div id="wrap" style="position:relative"></div>
<script type="module">
import * as THREE from 'three';
const W = 2400, H = 2000;
const boxes = await (await fetch('boxes.json')).json();

const COL = {
  BPR: 0xb8622e, VBPR: 0xe8954f, VBPR2: 0xe8954f, VSD12: 0xe8954f, VSD: 0xe8954f, VG2: 0xe8954f,
  ACT: 0xd2d5db, ACT2: 0xd2d5db,
  GATE: 0x7b80b0, GATE2: 0x7b80b0, VG12: 0x5d6296,
  SDCON: 0xf4a08f, SDCON2: 0x8fb8f5, M0: 0xf0a35e,
  INTERTIER: 0xb8eef3, BACKDIEL: 0xdfe3ea,
};
const TRANSP = { GATE: 0.5, GATE2: 0.5, INTERTIER: 0.55, BACKDIEL: 0.32 };
// dielectric slabs from GTA5cfet.itf: bottom_diel + BPR_diel + BOX_diel = 0..118 nm, INTERTIER_diel = 206..236 nm
boxes.push({ L: 'BACKDIEL', x0: -22.8, y0: -12.3, x1: 100.8, y1: 84.3, z0: 0, z1: 118 });
boxes.push({ L: 'INTERTIER', x0: -22.5, y0: -2, x1: 100.5, y1: 72, z0: 206, z1: 236 });

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.setClearColor(0xffffff);
document.getElementById('wrap').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cx = 39, cy = 36, cz = 174;
const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, -5000, 5000);
cam.up.set(0, 0, 1);
const dir = new THREE.Vector3(-1.0, -1.55, 0.85).normalize();
cam.position.set(cx + dir.x * 1000, cy + dir.y * 1000, cz + dir.z * 1000);
cam.lookAt(cx, cy, cz);
cam.zoom = 4.3; cam.updateProjectionMatrix();
scene.add(new THREE.AmbientLight(0xffffff, 1.35));
const d1 = new THREE.DirectionalLight(0xffffff, 1.5); d1.position.set(-300, -500, 800); scene.add(d1);
const d2 = new THREE.DirectionalLight(0xffffff, 0.5); d2.position.set(400, 200, 300); scene.add(d2);
for (const b of boxes) {
  const g = new THREE.BoxGeometry(b.x1 - b.x0, b.y1 - b.y0, b.z1 - b.z0);
  const t = TRANSP[b.L];
  const m = new THREE.MeshLambertMaterial({ color: COL[b.L], transparent: !!t, opacity: t || 1, depthWrite: !t });
  const mesh = new THREE.Mesh(g, m); b.mesh = mesh;
  mesh.position.set((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, (b.z0 + b.z1) / 2);
  if (t) mesh.renderOrder = (b.L === 'BACKDIEL' || b.L === 'INTERTIER') ? 4 : 2;
  scene.add(mesh);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: 0x3a3d48, transparent: true, opacity: t ? 0.3 : 0.45 }));
  e.position.copy(mesh.position); e.renderOrder = 5; scene.add(e);
}
renderer.render(scene, cam);

// labels: [text, box, preferred anchor, side]; each dot moves to the nearest point of that box the camera actually sees
const proj = (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H]; };
const find = (L, f = () => true) => boxes.find(b => b.L === L && f(b));
const L = [
  ['Front-side M0', find('M0', b => b.y0 > 20), b => [b.x1 - 4, (b.y0 + b.y1) / 2, b.z1], 'R'],
  ['Gate contact (VG2)', find('VG2'), b => [b.x1, (b.y0 + b.y1) / 2, (b.z0 + b.z1) / 2], 'R'],
  ['Top gate (GATE2)', find('GATE2', b => b.x0 > 30 && b.x0 < 40), b => [39, b.y0, b.z1 - 6], 'R'],
  ['nFET nanosheets, top tier (ACT2)', find('ACT2'), b => [-14, b.y0, (b.z0 + b.z1) / 2], 'L'],
  ['n\u207a S/D contact (SDCON2)', find('SDCON2', b => b.x0 > 40), b => [b.x1, b.y0 + 8, b.z1 - 12], 'R'],
  ['Inter-tier dielectric', find('INTERTIER'), b => [b.x1 - 3, b.y0, (b.z0 + b.z1) / 2], 'R'],
  ['Bottom gate (GATE)', find('GATE', b => b.x0 > 30 && b.x0 < 40), b => [39, b.y0, b.z1 - 6], 'R'],
  ['pFET nanosheets, bottom tier (ACT)', find('ACT'), b => [-14, b.y0, (b.z0 + b.z1) / 2], 'L'],
  ['p\u207a S/D contact (SDCON)', find('SDCON', b => b.x0 > 40), b => [b.x1, b.y0 + 8, b.z0 + 12], 'R'],
  ['Backside contact to VDD (VBPR)', find('VBPR'), b => [b.x1, b.y0, (b.z0 + b.z1) / 2], 'R'],
  ['Backside dielectric', find('BACKDIEL'), b => [b.x1 - 3, b.y0, 70], 'R'],
  ['Output via to M0 (VSD)', find('VSD'), b => [b.x0, b.y0, b.z1 - 10], 'L'],
  ['Gate-to-gate via (VG12)', find('VG12'), b => [b.x0, b.y0, b.z0 + 30], 'L'],
  ['Drain-to-drain via (VSD12)', find('VSD12'), b => [b.x0, b.y0, b.z0 + 40], 'L'],
  ['Backside contact to VSS (VBPR2)', find('VBPR2'), b => [b.x0, b.y0, b.z0 + 60], 'L'],
  ['Backside power rail, VDD (BPR)', find('BPR', b => b.y0 > 30), b => [b.x0 + 6, (b.y0 + b.y1) / 2, b.z1], 'L'],
  ['Backside power rail, VSS (BPR)', find('BPR', b => b.y0 < 0), b => [b.x0 + 8, b.y0, (b.z0 + b.z1) / 2], 'L'],
];

const rc = new THREE.Raycaster();
const solid = boxes.filter(b => b.L !== 'BACKDIEL' && b.L !== 'INTERTIER').map(b => b.mesh);
const slabs = { BACKDIEL: 1, INTERTIER: 1 };
function firstHit(sx, sy) {
  rc.setFromCamera(new THREE.Vector2(sx / W * 2 - 1, 1 - sy / H * 2), cam);
  const h = rc.intersectObjects(solid, false);
  return h.length ? h[0].object : null;
}
function visAnchor(b, pref, name) {
  if (slabs[b.L]) return proj(...pref);
  const cands = [];
  const N = 8;
  for (let i = 1; i < N; i++) for (let j = 1; j < N; j++) {
    const u = i / N, v = j / N;
    cands.push([b.x0, b.y0 + u * (b.y1 - b.y0), b.z0 + v * (b.z1 - b.z0)]);   // -x face
    cands.push([b.x0 + u * (b.x1 - b.x0), b.y0, b.z0 + v * (b.z1 - b.z0)]);   // -y face
    cands.push([b.x0 + u * (b.x1 - b.x0), b.y0 + v * (b.y1 - b.y0), b.z1]);   // top face
  }
  const d2 = q => (q[0] - pref[0]) ** 2 + (q[1] - pref[1]) ** 2 + (q[2] - pref[2]) ** 2;
  cands.sort((a, c) => d2(a) - d2(c));
  for (const q of cands) { const p = proj(...q); if (firstHit(p[0], p[1]) === b.mesh) return p; }
  console.log('NO VISIBLE ANCHOR for', name); return proj(...pref);
}
const ov = document.createElement('canvas'); ov.id = 'ov'; ov.width = W; ov.height = H;
document.getElementById('wrap').appendChild(ov);
const c = ov.getContext('2d');
c.font = '400 34px Inter, "Helvetica Neue", Arial, sans-serif'; c.textBaseline = 'middle';
for (const side of ['L', 'R']) {
  const items = L.filter(l => l[3] === side).map(([t, b, a]) => { const p = visAnchor(b, a(b), t); return { t, p, y: p[1] }; });
  items.sort((a, b) => a.y - b.y);
  for (let i = 1; i < items.length; i++) items[i].y = Math.max(items[i].y, items[i - 1].y + 56);
  const xs = items.map(i => i.p[0]);
  const colX = side === 'R' ? Math.max(...xs) + 120 : Math.min(...xs) - 120;
  for (const it of items) {
    c.strokeStyle = '#222'; c.lineWidth = 2.2;
    c.beginPath(); c.moveTo(it.p[0], it.p[1]); c.lineTo(colX, it.y); c.lineTo(colX + (side === 'R' ? 24 : -24), it.y); c.stroke();
    c.fillStyle = '#222'; c.beginPath(); c.arc(it.p[0], it.p[1], 5.5, 0, 7); c.fill();
    c.textAlign = side === 'R' ? 'left' : 'right';
    c.fillText(it.t, colX + (side === 'R' ? 34 : -34), it.y);
  }
}
window.done = true;
</script></body></html>
